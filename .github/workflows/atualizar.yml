name: Atualizar radar de nichos

on:
  schedule:
    - cron: "17 12 1 * *"   # dia 1 de cada mês, 09:17 (Brasília)
  workflow_dispatch: {}      # botão "Run workflow" pra rodar na mão

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados do mês
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python collector/collect.py
      - name: Salvar dados no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data site/data.js
          git commit -m "Atualiza radar: $(date +%Y-%m)" || echo "Nada novo"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
